repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^migrations/sql/
      - id: end-of-file-fixer
        exclude: ^migrations/sql/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # Seeds de séries (ADR-0009, ADR-0010) : CSV gzip versionnés par
        # construction, le journalier dépasse 1 Mo par fichier.
        exclude: ^src/kuma_data_core/db/seeds/donnees/.*\.csv\.gz$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
